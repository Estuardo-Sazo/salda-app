<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Saldá · Control de deudas</title>
    <meta name="description" content="Registrá pagos y gastos, seguí tu plan y quedá libre de deudas." />
    <meta name="theme-color" content="#f3f8f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro/oscuro.
      try {
        var t = localStorage.getItem('salda-theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      /* Pantalla de carga mientras llega el JavaScript (React la reemplaza al montar). */
      html { background: oklch(0.975 0.006 165); }
      html.dark { background: oklch(0.155 0.016 212); }
      .boot { min-height: 100dvh; display: grid; place-items: center; }
      .boot svg { width: 56px; height: 56px; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { opacity: 0.55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Cargando Saldá">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="118" fill="#0F2D32" />
          <path
            d="M324 164C304 136 270 122 232 122C180 122 142 150 142 194C142 242 182 258 234 272C290 287 330 304 330 352C330 396 290 416 238 416C192 416 154 398 132 368"
            fill="none"
            stroke="#3FD9A6"
            stroke-width="60"
            stroke-linecap="round"
          />
          <circle cx="392" cy="412" r="33" fill="#D4FF5E" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
